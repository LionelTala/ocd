<main class="mx-auto max-w-5xl px-5 py-10">
  <app-stepper [current]="3" />

  <div class="mt-10 text-center">
    <h1 class="text-2xl font-extrabold tracking-tight">{{ 'offers.title' | t }}</h1>
    <p class="mt-1 text-ink-soft">{{ 'offers.subtitle' | t }}</p>
  </div>

  <ul class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (p of packages(); track p.id) {
      <li class="relative">
        @if (p.popular) {
          <span class="absolute -top-3 left-1/2 -translate-x-1/2 rounded-full bg-brand-500 px-3 py-0.5 text-xs font-semibold text-white">
            {{ 'offers.popular' | t }}
          </span>
        }
        <button
          type="button"
          (click)="booking.selectPackage(p.id)"
          [attr.aria-pressed]="booking.packageId() === p.id"
          class="flex h-full w-full flex-col rounded-2xl border bg-white p-5 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500"
          [class]="
            booking.packageId() === p.id
              ? 'border-brand-500 ring-2 ring-brand-500'
              : p.popular
                ? 'border-brand-500/60 hover:border-brand-500'
                : 'border-line hover:border-brand-500/60'
          "
        >
          <span class="flex items-start justify-between">
            @switch (p.icon) {
              @case ('crown') { <svg lucideCrown class="size-6 text-brand-500"></svg> }
              @case ('rocket') { <svg lucideRocket class="size-6 text-brand-500"></svg> }
              @case ('trending') { <svg lucideTrendingUp class="size-6 text-brand-500"></svg> }
              @case ('star') { <svg lucideStar class="size-6 text-brand-500"></svg> }
              @case ('gem') { <svg lucideGem class="size-6 text-brand-500"></svg> }
            }
            @if (booking.packageId() === p.id) {
              <span class="flex size-6 items-center justify-center rounded-full bg-brand-500 text-white">
                <svg lucideCheck class="size-4"></svg>
              </span>
            } @else {
              <span class="size-6 rounded-full border border-line"></span>
            }
          </span>

          <span class="mt-3 block text-lg font-bold">{{ p.name }}</span>
          <span class="block text-sm text-ink-soft">{{ duration(p.durationMinutes) }} {{ 'offers.live' | t }}</span>
          <span class="mt-3 block text-2xl font-extrabold">
            {{ price(p.priceFcfa) }} <span class="text-sm font-semibold">FCFA</span>
          </span>
          <span class="mt-2 block text-sm text-ink-soft">{{ i18n.l(p.description) }}</span>

          <span class="mt-4 block border-t border-line pt-4 text-sm">
            @if (p.includes) {
              <span class="mb-2 block font-semibold">{{ 'offers.includesAll' | t }} {{ nameOf(p.includes) }}</span>
            }
            @for (item of p.benefits; track $index) {
              <span class="mt-1.5 flex gap-2 text-ink-soft">
                <svg lucideCheck class="mt-0.5 size-4 shrink-0 text-brand-500"></svg>
                <span>{{ i18n.l(item.text) }}{{ item.needsApproval ? ' *' : '' }}</span>
              </span>
            }
          </span>
        </button>
      </li>
    }
  </ul>

  <p class="mt-8 text-center text-sm text-ink-soft">{{ 'offers.commonNote' | t }}</p>
  <p class="mt-2 text-center text-xs text-ink-soft">{{ 'offers.approvalNote' | t }}</p>

  <div class="mt-10 flex items-center justify-between">
    <a
      routerLink="/reserver/date"
      class="inline-flex h-11 items-center gap-2 rounded-full border border-line px-5 text-sm font-semibold hover:border-brand-500"
    >
      <svg lucideArrowLeft class="size-4"></svg>
      {{ 'common.back' | t }}
    </a>
    <button
      type="button"
      [disabled]="!booking.packageId()"
      (click)="next()"
      class="inline-flex h-11 items-center gap-2 rounded-full bg-brand-500 px-6 text-sm font-semibold text-white hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-brand-500"
    >
      {{ 'common.continue' | t }}
      <svg lucideArrowRight class="size-4"></svg>
    </button>
  </div>
</main>
