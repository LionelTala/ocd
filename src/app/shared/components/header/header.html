<header class="relative border-b border-line/60 bg-ivory">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-5">
    <a routerLink="/" (click)="closeMenu()" class="text-xl font-extrabold tracking-tight text-brand-500">
      OCD<span class="text-ink"> Live</span>
    </a>

    <nav class="hidden items-center gap-7 text-sm font-medium text-ink-soft md:flex">
      @for (link of links; track link.key) {
        <a
          [routerLink]="link.href"
          routerLinkActive="text-brand-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="hover:text-brand-600"
        >{{ link.key | t }}</a>
      }
    </nav>

    <div class="flex items-center gap-3">
      <label class="relative">
        <span class="sr-only">{{ 'lang.label' | t }}</span>
        <select
          class="h-9 cursor-pointer appearance-none rounded-full border border-line bg-white pl-3 pr-8 text-sm font-medium focus:outline-2 focus:outline-brand-500"
          [value]="i18n.lang()"
          (change)="onLangChange($event)"
        >
          <option value="fr">FR</option>
          <option value="en">EN</option>
        </select>
        <svg lucideChevronDown class="pointer-events-none absolute right-2.5 top-2.5 size-4 text-ink-soft"></svg>
      </label>

      <a
        routerLink="/"
        fragment="choose"
        class="hidden h-9 items-center gap-2 rounded-full bg-brand-500 px-4 text-sm font-semibold text-white hover:bg-brand-600 md:inline-flex"
      >
        {{ 'cta.book' | t }}
        <svg lucideArrowRight class="size-4"></svg>
      </a>

      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="(menuOpen() ? 'nav.close' : 'nav.menu') | t"
        class="flex size-9 items-center justify-center rounded-full border border-line bg-white focus-visible:outline-2 focus-visible:outline-brand-500 md:hidden"
      >
        @if (menuOpen()) {
          <svg lucideX class="size-5"></svg>
        } @else {
          <svg lucideMenu class="size-5"></svg>
        }
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-menu"
      class="absolute inset-x-0 top-full z-30 border-b border-line bg-ivory px-5 pb-6 pt-2 shadow-sm md:hidden"
    >
      <ul class="divide-y divide-line">
        @for (link of links; track link.key) {
          <li>
            <a
              [routerLink]="link.href"
              routerLinkActive="text-brand-600"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
              class="block py-3.5 text-base font-semibold"
            >{{ link.key | t }}</a>
          </li>
        }
      </ul>
      <a
        routerLink="/"
        fragment="choose"
        (click)="closeMenu()"
        class="mt-4 inline-flex h-11 w-full items-center justify-center gap-2 rounded-full bg-brand-500 font-semibold text-white hover:bg-brand-600"
      >
        {{ 'cta.book' | t }}
        <svg lucideArrowRight class="size-4"></svg>
      </a>
    </nav>
  }
</header>
