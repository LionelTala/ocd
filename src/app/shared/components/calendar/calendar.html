<div class="w-full max-w-sm rounded-2xl border border-line bg-white p-4">
  <div class="mb-3 flex items-center justify-between">
    <button
      type="button"
      (click)="changeMonth(-1)"
      [disabled]="!canGoPrev()"
      [attr.aria-label]="'calendar.prev' | t"
      class="flex size-9 items-center justify-center rounded-full hover:bg-brand-50 disabled:opacity-30 disabled:hover:bg-transparent"
    >
      <svg lucideChevronLeft class="size-5"></svg>
    </button>
    <p class="text-sm font-semibold capitalize">{{ monthLabel() }}</p>
    <button
      type="button"
      (click)="changeMonth(1)"
      [attr.aria-label]="'calendar.next' | t"
      class="flex size-9 items-center justify-center rounded-full hover:bg-brand-50"
    >
      <svg lucideChevronRight class="size-5"></svg>
    </button>
  </div>

  <div class="grid grid-cols-7 gap-1 text-center text-xs text-ink-soft">
    @for (w of weekdays(); track $index) {
      <span class="py-1 capitalize">{{ w }}</span>
    }
  </div>

  <div class="mt-1 grid grid-cols-7 gap-1">
    @for (cell of cells(); track $index) {
      @if (cell) {
        <button
          type="button"
          (click)="pick(cell)"
          [disabled]="cell.disabled"
          [attr.aria-pressed]="cell.iso === selected()"
          class="mx-auto flex size-10 items-center justify-center rounded-full text-sm font-medium focus-visible:outline-2 focus-visible:outline-brand-500"
          [class]="
            cell.iso === selected()
              ? 'bg-brand-500 text-white'
              : cell.disabled
                ? 'cursor-not-allowed text-ink-soft/40'
                : 'hover:bg-brand-50'
          "
        >
          {{ cell.day }}
        </button>
      } @else {
        <span></span>
      }
    }
  </div>
</div>
