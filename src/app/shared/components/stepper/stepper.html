<ol class="flex items-start justify-between gap-1" aria-label="Progression">
  @for (key of steps; track key; let i = $index) {
    <li
      class="flex flex-1 flex-col items-center gap-2 text-center"
      [attr.aria-current]="i + 1 === current() ? 'step' : null"
    >
      <span
        class="flex size-7 items-center justify-center rounded-full border text-xs font-bold"
        [class]="
          i + 1 < current()
            ? 'border-brand-500 bg-brand-500 text-white'
            : i + 1 === current()
              ? 'border-brand-500 bg-white text-brand-600'
              : 'border-line bg-white text-ink-soft'
        "
      >
        @if (i + 1 < current()) {
          <svg lucideCheck class="size-4"></svg>
        } @else {
          {{ i + 1 }}
        }
      </span>
      <span
        class="hidden text-xs font-medium sm:block"
        [class]="i + 1 === current() ? 'text-ink' : 'text-ink-soft'"
      >
        {{ key | t }}
      </span>
    </li>
  }
</ol>
